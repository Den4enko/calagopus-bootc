name: Build and Push bootc Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # Daily build at 18:00 UTC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: centos
            base_image: quay.io/centos-bootc/centos-bootc:stream10
            tag_suffix: centos10
            is_latest: true
          - distro: fedora
            base_image: quay.io/fedora/fedora-bootc:44
            tag_suffix: fedora
            is_latest: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.is_latest && github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.tag_suffix }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,suffix=-${{ matrix.tag_suffix }}
            type=ref,event=branch,suffix=-${{ matrix.tag_suffix }}

      - name: Build Image with Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: |
            ./Containerfile
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
          oci: true

      - name: Push to Registry
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}
