# State directory
d /var/lib/calagopus 0755 root root - -

# Config directory
d /etc/calagopus 0755 root root - -

# Default config
C /etc/calagopus/config.yml - - - - /usr/share/calagopus/config.yml

# NoCoW attribute
h /var/lib/calagopus - - - - +C

# SELinux context
z /var/lib/calagopus - - - - system_u:object_r:container_file_t:s0
