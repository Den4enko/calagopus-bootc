# State directory
d /var/lib/calagopus 0755 root root - -

# Config directory
d /etc/calagopus 0700 root root - -

# Default config
C /etc/calagopus/config.yml - - - - /usr/share/calagopus/config.yml
C /etc/calagopus/panel.env - - - - /usr/share/calagopus/panel.env

# Log directory
d /var/log/calagopus 0755 root root - -
d /var/log/calagopus/panel 0755 root root - -

# Panel directories
d /var/lib/calagopus/panel 0755 root root - -
d /var/lib/calagopus/panel/postgres 0700 root root - -
d /var/lib/calagopus/panel/cache 0700 root root - -
d /var/lib/calagopus/panel/data 0700 root root - -

# Panel Heavy directories
d /var/lib/calagopus/panel/binaries 0755 root root - -
d /var/lib/calagopus/panel/translations 0755 root root - -
d /var/lib/calagopus/panel/extensions 0755 root root - -
d /var/lib/calagopus/panel/extension-migrations 0755 root root - -

# Tmp directory
d /var/lib/calagopus/tmp 0755 root root - -

# Certs directory
d /etc/calagopus/certs 0700 root root - -