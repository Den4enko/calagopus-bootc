# State directory
d /var/lib/calagopus 0755 root root - -

# Config directory
d /etc/calagopus 0700 root root - -

# Default config
C /etc/calagopus/config.yml - - - - /usr/share/calagopus/config.yml
C /etc/calagopus/panel.env - - - - /usr/share/calagopus/panel.env

# Log directory
d /var/log/calagopus 0700 root root - -

# Tmp directory
d /var/lib/calagopus/tmp 0755 root root - -

# Certs directory
d /etc/calagopus/certs 0700 root root - -