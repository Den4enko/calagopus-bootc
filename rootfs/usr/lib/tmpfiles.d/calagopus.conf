# State directory
d /var/lib/calagopus 0755 root root - -

# Config directory
d /etc/calagopus 0700 root root - -

# Default config
C /etc/calagopus/config.yml - - - - /usr/share/calagopus/config.yml

# Log directory
d /var/log/calagopus 0700 root root - -

# Tmp directory
d /tmp/calagopus 0700 root root - -

# Certs directory
d /etc/calagopus/certs 0700 root root - -

# NoCoW attribute
h /var/lib/calagopus - - - - +C

# SELinux context
z /var/lib/calagopus - - - - system_u:object_r:container_file_t:s0